<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ToDo List Web</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>ToDo List</h1>
            <button id="themeToggle" class="btn-theme">Dark Mode</button>
        </header>
        <div class="container">
            <main class="todoWeb">
                <h2>My Tasks</h2>
                <div id="taskList"></div>
            </main>
            <aside class="addTask">
                <h2>Add New Task</h2>
                <form id="todoForm">
                    <label for="newTask">Task Name:</label><br>
                    <input type="text" id="newTask" placeholder="Enter new task..." required><br>
                    
                    <label for="taskTime">Task Time:</label><br>
                    <input type="time" id="taskTime" placeholder="Enter task time..." required><br>
                    
                    <button type="submit">Add Task</button>
                </form>
            </aside>
        </div>
        <footer>
            <p>&copy; 2026 ToDo List</p>   
        </footer>
        
        <script src="script.js"></script>
    </body>
</html>
